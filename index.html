<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Упражнения</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --link: var(--tg-theme-link-color, #2563eb);
    --btn: var(--tg-theme-button-color, #3b82f6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --soft: var(--tg-theme-secondary-bg-color, #f1f1f3);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ===== Список ===== */
  .head { padding: 16px 16px 8px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .head h1 { font-size: 24px; font-weight: 700; }
  .search {
    width: 100%; margin-top: 12px; padding: 12px 14px; border: 0; border-radius: 12px;
    background: var(--soft); color: var(--text); font: inherit; font-size: 16px;
  }
  .search::placeholder { color: var(--hint); }
  .section-title { padding: 20px 16px 6px; font-size: 14px; font-weight: 600; color: var(--hint); }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 16px; border: 0; background: none; text-align: left; cursor: pointer;
    border-bottom: 1px solid var(--soft);
  }
  .row:active { background: var(--soft); }
  .row .t { flex: 1; font-size: 17px; }
  .row .s { display: block; font-size: 13px; color: var(--hint); margin-top: 2px; }
  .row::after {
    content: ""; width: 8px; height: 8px; flex: none;
    border-right: 2px solid var(--hint); border-top: 2px solid var(--hint);
    transform: rotate(45deg);
  }
  .group-title { padding: 12px 16px 2px; font-size: 13px; font-weight: 600; color: var(--link); }
  .empty { padding: 40px 16px; text-align: center; color: var(--hint); }

  /* ===== Карточка упражнения ===== */
  .carousel { position: relative; background: #000; }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .slides::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; aspect-ratio: 16 / 9; scroll-snap-align: start; position: relative;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.9); font-weight: 600;
  }
  .slide iframe, .slide video, .slide img { width: 100%; height: 100%; border: 0; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 10px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 500; pointer-events: none;
  }
  .open {
    position: absolute; top: 8px; right: 8px; padding: 5px 10px; border: 0; border-radius: 10px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 13px; cursor: pointer;
  }
  .dots { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 7px; pointer-events: none; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); transition: background .2s, transform .2s; }
  .dots i.on { background: #fff; transform: scale(1.25); }

  .content { padding: 18px 16px 24px; }
  .title { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .meta { color: var(--hint); font-size: 15px; margin-top: 6px; }
  .stats { display: flex; gap: 10px; margin-top: 16px; }
  .stat { flex: 1; background: var(--soft); border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 13px; color: var(--hint); }
  .warn { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--soft); font-size: 15px; line-height: 1.45; }
  .desc { font-size: 16px; line-height: 1.5; margin-top: 16px; }

  details { border-top: 1px solid var(--soft); }
  details:last-of-type { border-bottom: 1px solid var(--soft); }
  summary { list-style: none; cursor: pointer; padding: 16px 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: ""; width: 8px; height: 8px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(-45deg); transition: transform .2s;
  }
  details[open] summary::before { transform: rotate(45deg); }
  .body { padding: 0 0 16px 18px; font-size: 16px; line-height: 1.55; }
  .body ol, .body ul { padding-left: 20px; }
  .body li { margin: 6px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tags span { background: var(--soft); padding: 6px 12px; border-radius: 14px; font-size: 14px; }

  .actions { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 15px 12px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
    background: var(--soft);
  }
  .btn.primary { grid-column: 1 / -1; background: var(--btn); color: var(--btn-text); }
  .btn:active { opacity: .75; }
  .btn::after { content: "↗"; font-size: 14px; opacity: .7; }
  .row:focus-visible, .btn:focus-visible, summary:focus-visible, .search:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .back { margin: 12px 16px 0; padding: 8px 0; border: 0; background: none; color: var(--link); font-size: 16px; cursor: pointer; }
</style>
</head>

    let g = null;
    items.forEach(i => {
      if (i.group && i.group !== g) { html += `<div class="group-title">${i.group}</div>`; }
      g = i.group;
      html += `<button class="row" data-id="${i.id}"><span class="t">${i.label || i.title}${i.subtitle ? `<span class="s">${i.subtitle}</span>` : ""}</span></button>`;
    });
  });
  listEl.innerHTML = html || `<div class="empty">Ничего не найдено</div>`;
}
listEl.addEventListener("click", e => {
  const r = e.target.closest(".row");
  if (r) openCard(r.dataset.id);
});
$("#search").addEventListener("input", e => renderList(e.target.value));

/* ---------- Карточка ---------- */
function slideHTML(m, i) {
  if (m.type === "youtube")
    return `<div class="slide" data-embed="https://www.youtube.com/embed/${m.id}?playsinline=1&rel=0"><iframe allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe><span class="badge">YouTube</span><button class="open" data-open="https://youtu.be/${m.id}">Открыть</button></div>`;
  if (m.type === "vk")
    return `<div class="slide" data-embed="https://vk.com/video_ext.php?oid=${m.oid}&id=${m.vid}"><iframe allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe><span class="badge">ВК</span><button class="open" data-open="${m.open || `https://vkvideo.ru/video${m.oid}_${m.vid}`}">Открыть</button></div>`;
  if (m.type === "mp4")
    return `<div class="slide"><video src="${m.src}" ${m.poster ? `poster="${m.poster}"` : ""} controls playsinline muted loop preload="metadata"></video><span class="badge">Видео</span></div>`;
  if (m.type === "gif")
    return `<div class="slide"><img src="${m.src}" alt="" loading="lazy"><span class="badge">GIF</span></div>`;
  return `<div class="slide"><img src="${m.src}" alt="" loading="lazy"><span class="badge">Фото</span></div>`;
}
const list = (arr, tag) => `<${tag}>${arr.map(x => `<li>${x}</li>`).join("")}</${tag}>`;

function openCard(id) {
  const ex = all.find(i => i.id === id);
  if (!ex) return;
  const media = ex.media || [];
  const section = SECTIONS.find(s => s.items.includes(ex));
  let h = `<div class="carousel"><div class="slides" id="slides">`;
  h += media.length
    ? media.map(slideHTML).join("")
    : `<div class="slide" style="background:linear-gradient(135deg,#475569,#0f172a)">Видео в группе Telegram</div>`;
  h += `</div><div class="dots" id="dots"></div></div><div class="content">`;
  h += `<h1 class="title">${ex.title}</h1><div class="meta">${section.title}</div>`;
  if (ex.sets) h += `<div class="stats"><div class="stat"><b>${ex.sets}</b><span>подхода</span></div><div class="stat"><b>${ex.reps}</b><span>повторов</span></div><div class="stat"><b>${ex.rest}</b><span>отдых</span></div></div>`;
  if (ex.warn) h += `<div class="warn">${ex.warn}</div>`;
  if (ex.desc) h += `<p class="desc">${ex.desc}</p>`;
  h += `<div style="margin-top:12px">`;
  if (ex.steps) h += `<details><summary>Техника по шагам</summary><div class="body">${list(ex.steps, "ol")}</div></details>`;
  if (ex.mistakes) h += `<details><summary>Частые ошибки</summary><div class="body">${list(ex.mistakes, "ul")}</div></details>`;
  if (ex.tags) h += `<details><summary>Теги</summary><div class="body"><div class="tags">${ex.tags.map(t => `<span>${t}</span>`).join("")}</div></div></details>`;
  h += `</div><div class="actions">`;
  if (ex.tg && !media.length) h += `<button class="btn primary" data-open="${ex.tg}">Смотреть видео в группе</button>`;
  h += `<button class="btn ${media.length ? "primary" : ""}" data-open="${CONTACT}" ${media.length ? "" : 'style="grid-column:1/-1"'}>Задать вопрос тренеру</button></div></div>`;
  if (!tg) h = `<button class="back" id="back">‹ Назад</button>` + h; // в Telegram работает системная кнопка «Назад»

  cardView.innerHTML = h;
  listView.classList.add("hidden");
  cardView.classList.remove("hidden");
  window.scrollTo(0, 0);
  if (tg) tg.BackButton.show();
  setupCarousel();
}

function closeCard() {
  stopAll();
  cardView.classList.add("hidden");
  listView.classList.remove("hidden");
  if (tg) tg.BackButton.hide();
}
if (tg) tg.BackButton.onClick(closeCard);
cardView.addEventListener("click", e => {
  if (e.target.id === "back") return closeCard();
  const b = e.target.closest("[data-open]");
  if (!b) return;
  const url = b.dataset.open;
  if (!tg) return window.open(url, "_blank");
  url.startsWith("https://t.me/") ? tg.openTelegramLink(url) : tg.openLink(url);
});

/* ---------- Карусель: точки + загрузка/остановка видео ---------- */
let io;
function stopAll() { if (io) io.disconnect(); }
function setupCarousel() {
  const slides = $("#slides"), dots = $("#dots");
  const n = slides.children.length;
  dots.innerHTML = n > 1 ? "<i></i>".repeat(n) : "";
  const mark = () => {
    const idx = Math.round(slides.scrollLeft / slides.clientWidth);
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i === idx));
  };
  slides.addEventListener("scroll", mark, { passive: true });
  mark();

  stopAll();
  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const s = e.target, on = e.isIntersecting && e.intersectionRatio > 0.6;
      const f = s.querySelector("iframe"), v = s.querySelector("video");
      if (f) { on ? (f.src || (f.src = s.dataset.embed)) : (f.src && f.setAttribute("src", "about:blank"), f.removeAttribute("src")); }
      if (v) { on ? v.play().catch(() => {}) : v.pause(); }
    });
  }, { root: slides, threshold: [0, 0.6, 1] });
  [...slides.children].forEach(s => io.observe(s));
}

/* ---------- Старт ---------- */
renderList();
// Прямая ссылка на упражнение: t.me/ВАШ_БОТ/ПРИЛОЖЕНИЕ?startapp=glute-bridge
const startId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || location.hash.slice(1);
if (startId) openCard(startId);
</script>
